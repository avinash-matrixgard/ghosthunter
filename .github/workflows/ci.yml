name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.4.0"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies (with all extras)
        run: poetry install --with dev --all-extras
      - name: pytest
        run: poetry run pytest -v --tb=short

  pip-audit:
    name: pip-audit (dependency vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Poetry + export plugin + pip-audit
        # Modern Poetry (1.8+) ships `export` as a separate plugin.
        # Inject `poetry-plugin-export` into the pipx-managed Poetry env.
        run: |
          pipx install poetry
          pipx inject poetry poetry-plugin-export
          pipx install pip-audit
      - name: Export requirements
        # Exports the COMMITTED poetry.lock (added 2026-09-23). Before the
        # lock existed this step resolved fresh every run, so the audit was
        # of whatever PyPI happened to serve that morning, never of what the
        # repo declares. That is why it kept reporting "No known
        # vulnerabilities found" while GitHub carried 12 open Dependabot
        # alerts against the same project.
        run: poetry export --with dev --all-extras --without-hashes -f requirements.txt -o requirements.txt
      - name: pip-audit
        # The old comment here claimed this only warns and that --strict is
        # what fails the build on a vulnerability. Both halves were wrong:
        # pip-audit exits non-zero on any vulnerability with or without
        # --strict, so this step has always been blocking. --strict adds the
        # other half, failing when a dependency cannot be audited at all,
        # which is now safe to turn on because the lock pins every one.
        run: pip-audit --strict -r requirements.txt
